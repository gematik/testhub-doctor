name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CLI and GUI (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            executable-extension: ''
          - os: windows-latest
            platform: windows
            executable-extension: '.exe'
          - os: macos-latest
            platform: macos
            executable-extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify third-party license reports
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          bash scripts/update-licenses.sh --check
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev
      - name: Test CLI
        run: cargo test --locked -p testhub-doctor
      - name: Build CLI
        run: cargo build --locked --release --bin testhub-doctor
      - name: Build GUI
        run: cargo build --locked --release -p testhub-doctor-gui
      - name: Package binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ runner.arch }}
          EXE_EXTENSION: ${{ matrix.executable-extension }}
        run: |
          mkdir -p dist
          for variant in cli gui; do
            binary=testhub-doctor
            if [ "$variant" = gui ]; then
              binary=testhub-doctor-gui
            fi
            tar -czf "dist/testhub-doctor-${variant}-${PLATFORM}-${ARCHITECTURE}.tar.gz" \
              -C target/release "${binary}${EXE_EXTENSION}" \
              -C ../.. LICENSE THIRD_PARTY_LICENSES.md README.md
          done
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: testhub-doctor-cli-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/testhub-doctor-cli-*.tar.gz
          if-no-files-found: error
      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: testhub-doctor-gui-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/testhub-doctor-gui-*.tar.gz
          if-no-files-found: error

  draft-release:
    name: Create draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: testhub-doctor-*
          path: dist
          merge-multiple: true
      - name: Create draft release with binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six release archives, found ${#archives[@]}." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${archives[@]}" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes
