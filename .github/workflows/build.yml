name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify third-party license reports
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          bash scripts/update-licenses.sh --check
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev
      - name: Test CLI
        run: cargo test -p testhub-doctor
      - name: Build CLI and Tauri GUI
        run: cargo build --release --workspace
