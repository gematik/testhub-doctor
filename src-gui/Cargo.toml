[package]
name = "testhub-doctor-gui"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = "2.7.6"

[dependencies]
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.7", features = ["image-png"] }
testhub-doctor = { path = ".." }

[[bin]]
name = "testhub-doctor-gui"
path = "src/main.rs"
