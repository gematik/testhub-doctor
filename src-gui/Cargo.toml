[package]
name = "testhub-doctor-gui"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
build = "build.rs"

[build-dependencies]
tauri-build = "2.7.1"

[dependencies]
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.1", features = ["image-png"] }
testhub-doctor = { path = ".." }

[[bin]]
name = "testhub-doctor-gui"
path = "src/main.rs"
