[package]
name = "testhub-doctor"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Cross-platform prerequisite checks for the TI 2.0 Testhub"

[workspace]
members = ["src-gui"]
default-members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.3"
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
wait-timeout = "0.2.1"

[[bin]]
name = "testhub-doctor"
path = "src/main.rs"
